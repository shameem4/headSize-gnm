<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>headSize GNM</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="gnm.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
<div class="page-info">
  <a href="https://shameem4.github.io/headSize/">Face demo (headSize)</a>
  <a href="https://github.com/google/GNM">GNM Head</a>
  <span id="last_modified"></span>
</div>
<script>
  document.getElementById("last_modified").textContent =
    "Last modified " + new Date(document.lastModified).toLocaleDateString("en-CA");
</script>
  <div class="app">
    <section>
      <div id="liveView" class="videoView">
        <div class="video-shell">
          <video id="webcam" autoplay playsinline></video>
          <canvas id="gnm_canvas"></canvas>
          <canvas id="guide_canvas"></canvas>
          <div class="guide-msg" id="guide_msg" hidden>
            <span id="guide_text"></span>
          </div>
          <div class="glasses-status" id="glasses_status" hidden>Glasses detected</div>
          <p class="status" id="status">Loading models…</p>
          <div class="calib" id="calib" hidden>
            <canvas id="calib_canvas"></canvas>
            <div class="calib-bar">
              <span id="calib_text"></span>
              <div class="calib-buttons">
                <button type="button" id="calib_confirm">Confirm</button>
                <button type="button" id="calib_retake">Retake</button>
                <button type="button" id="calib_cancel">Cancel</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <aside class="metrics-panel">
      <div class="metrics-controls">
        <label class="control toggle">
          <input type="checkbox" id="mesh_toggle" checked />
          <span>Head mesh</span>
        </label>
      </div>

      <div class="metric-card">
        <h2>Fit</h2>
        <div class="progress"><div class="progress-bar" id="progress_bar"></div></div>
        <div class="metric-row"><span class="label" id="fit_status">Waiting for a face</span></div>
        <div class="metric-row"><span class="label">Size from</span><span class="value" id="scale_status">--</span></div>
        <button class="control-button" id="remeasure" type="button">Measure again</button>
        <button class="control-button" id="measure_ears" type="button">Measure ears</button>
        <button class="control-button" id="calibrate_card" type="button">Calibrate with a card</button>
        <button class="control-button" id="calibrate_marker" type="button">Calibrate with printed marker</button>
        <div class="metric-row marker-row">
          <a href="marker.html" target="_blank" rel="noopener">Print the marker</a>
          <label>Printed 100 mm line measures
            <input type="number" id="ruler_mm" min="90" max="110" step="0.5" value="100" /> mm</label>
        </div>
        <button class="control-button secondary" id="calib_reset" type="button" hidden>Reset calibration</button>
        <input class="snapshot-label" id="snapshot_label" type="text" placeholder="Snapshot label, e.g. with glasses" />
        <button class="control-button" id="snapshot" type="button">Save snapshot</button>
      </div>

      <div class="panel-body" id="metrics_panel_body"></div>
      <p class="note">± is the typical error from simulation (experiments). Heads in GNM are bald; allow extra for hair.</p>
    </aside>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
